apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employee-app

  template:
    metadata:
      labels:
        app: employee-app

    spec:
      containers:
        - name: employee-app
          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 8081

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
